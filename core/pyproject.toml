[project]
name = "cave"
version = "0.1.0"
description = "Local-first smart-home hub"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "argon2-cffi>=23",
    "pyotp>=2.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cave*"]

[tool.setuptools.package-data]
cave = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
