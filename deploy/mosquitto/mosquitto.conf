# Mosquitto for CAVE.
# The installer (Phase 1 plan 7) creates the `cave` user and /mosquitto/config/passwd,
# and publishes port 1883 on your LAN only, so devices such as Tasmota plugs can connect.
# Anonymous access is off: every device and CAVE itself signs in.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
