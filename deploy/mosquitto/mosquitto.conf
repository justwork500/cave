# Mosquitto for CAVE.
# deploy/install.sh creates secrets/mosquitto_passwd (mounted here as /mosquitto/config/passwd) with the
# `cave` user. compose.yaml publishes port 1883 so devices on your LAN, such as Tasmota plugs, can connect.
# Anonymous access is off: every device and CAVE itself signs in.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
