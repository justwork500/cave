name: images
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build amd64 + arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: cave-core, both architectures
        run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/core/Dockerfile .
      - name: script-runner, both architectures
        run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/script-runner/Dockerfile .
      - name: PowerShell runs on each architecture
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load -t "runner-$arch" -f deploy/script-runner/Dockerfile .
            docker run --rm --platform "linux/$arch" --entrypoint pwsh "runner-$arch" \
              -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          done

  compose-smoke:
    name: install and run the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install with deploy/install.sh
        run: deploy/install.sh --yes --profiles mqtt,scripts
      - name: smoke checks
        run: python3 deploy/smoke.py
      - name: a Zigbee2MQTT light through the real broker
        run: |
          pip install -e "core[dev]"
          CAVE_MQTT_TEST_BROKER=127.0.0.1:1883 CAVE_MQTT_TEST_USER=cave \
          CAVE_MQTT_PASSWORD="$(sudo cat secrets/mqtt_password)" \
            pytest core/tests/test_mqtt_client.py::test_live_broker_roundtrip -v
      - name: restart keeps the owner
        run: |
          docker compose restart cave
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q cave)")" = healthy ] && break
            sleep 2
          done
          python3 deploy/smoke.py --after-restart
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: stop (data kept)
        if: always()
        run: docker compose down
